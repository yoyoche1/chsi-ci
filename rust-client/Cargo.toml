[package]
name = "chsi-rust"
version = "6.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio-rustls = "0.24"
x509-parser = "0.15"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
