name: build-android-client
on:
  push:
    paths: ['android-client/**', '.github/workflows/build-android-client.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pkg
        run: npm install -g @yao-pkg/pkg
      - name: Build encrypted payload + core with k2
        run: node android-client/build-enc.js
      - name: Build exe (pkg bytecode, no icon)
        run: pkg android-client/package.json --output app.exe
      - name: Patch PE subsystem to GUI
        run: |
          $bytes = [IO.File]::ReadAllBytes('app.exe')
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $subOff = $peOff + 24 + 68
          if ($bytes[$subOff] -ne 3) { $bytes[$subOff] = 3 }
          [IO.File]::WriteAllBytes('app.exe', $bytes)
          Write-Host "subsystem=$($bytes[$subOff])"
      - name: Rename to final name
        run: Move-Item app.exe 高校认证.exe -Force
      - name: Bundle adb (platform-tools)
        run: |
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile pt.zip
          Expand-Archive -Path pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force -Path adb | Out-Null
          Copy-Item pt\platform-tools\adb.exe adb\
          Copy-Item pt\platform-tools\AdbWinApi.dll adb\
          Copy-Item pt\platform-tools\AdbWinUsbApi.dll adb\
      - name: Package zip (UTF-8 entry names)
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item 高校认证.exe stage\
          Copy-Item adb stage\adb -Recurse -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path chsi-android-client.zip) { Remove-Item chsi-android-client.zip -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path .\stage).Path, (Join-Path (Get-Location) 'chsi-android-client.zip'))
          Remove-Item stage -Recurse -Force
      - name: Smoke test
        run: |
          $p = Start-Process -FilePath .\高校认证.exe -PassThru -WindowStyle Hidden -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Host "EXITED code=$($p.ExitCode)"
            if (Test-Path err.txt) { Get-Content err.txt }
            if (Test-Path out.txt) { Get-Content out.txt }
            exit 1
          }
          Write-Host "ALIVE ✓"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: chsi-android-client
          path: chsi-android-client.zip
