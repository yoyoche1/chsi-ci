name: build-android-client
on:
  push:
    paths: ['android-client/**', '.github/workflows/build-android-client.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pkg
        run: npm install -g @yao-pkg/pkg
      - name: Build exe (icon applied during build, no rcedit post-patch)
        run: pkg android-client/client.js --targets node20-win-x64 --output ChsiHookClient.exe --icon android-client/icon.ico
      - name: Bundle adb (platform-tools)
        run: |
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile pt.zip
          Expand-Archive -Path pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force -Path adb | Out-Null
          Copy-Item pt\platform-tools\adb.exe adb\
          Copy-Item pt\platform-tools\AdbWinApi.dll adb\
          Copy-Item pt\platform-tools\AdbWinUsbApi.dll adb\
      - name: Package zip
        run: Compress-Archive -Path ChsiHookClient.exe,adb,android-client/client.js,android-client/config.json,android-client/termux-install.sh -DestinationPath chsi-android-client.zip -Force
      - name: Smoke test (exe must not print Pkg error)
        run: |
          $p = Start-Process -FilePath .\ChsiHookClient.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Host "EXITED code=$($p.ExitCode)"; Get-Content log.txt -ErrorAction SilentlyContinue; exit 1 }
          if (Test-Path log.txt) { Write-Host "LOG OK:"; Get-Content log.txt } else { Write-Host "no log.txt"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: chsi-android-client
          path: chsi-android-client.zip
