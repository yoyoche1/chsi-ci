name: build-rust-client
on:
  push:
    paths: ['rust-client/**', '.github/workflows/build-rust-client.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch adb for embedding
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile pt0.zip
          Expand-Archive -Path pt0.zip -DestinationPath pt0
          New-Item -ItemType Directory -Force -Path 'rust-client/assets' | Out-Null
          Copy-Item 'pt0/platform-tools/adb.exe' 'rust-client/assets/'
          Copy-Item 'pt0/platform-tools/AdbWinApi.dll' 'rust-client/assets/'
          Copy-Item 'pt0/platform-tools/AdbWinUsbApi.dll' 'rust-client/assets/'
      - name: Build release
        working-directory: rust-client
        run: cargo build --release
      # v9.2：Authenticode 自签——防静默换文件（有真证书可放 secrets CHSI_SIGN_PFX 替换）
      - name: Authenticode sign (self-signed or provided PFX)
        shell: pwsh
        run: |
          $exe = 'rust-client\target\release\chsi-rust.exe'
          if ($env:CHSI_SIGN_PFX) {
            [IO.File]::WriteAllBytes('sign.pfx', [Convert]::FromBase64String($env:CHSI_SIGN_PFX))
          } else {
            openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -keyout sign.key -out sign.crt -subj '/CN=ChsiTool Self-Sign' 2>$null
            openssl pkcs12 -export -out sign.pfx -inkey sign.key -in sign.crt -passout pass:chsi2026
          }
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Select-Object -First 1).FullName
          & $signtool sign /fd sha256 /a /f sign.pfx /p chsi2026 $exe
          if ($LASTEXITCODE -ne 0) { Write-Host 'SIGN FAILED'; exit 1 }
          Write-Host 'SIGN OK'
        env:
          CHSI_SIGN_PFX: ${{ secrets.CHSI_SIGN_PFX }}
      - name: Bundle zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item 'rust-client/target/release/chsi-rust.exe' 'stage/高校认证.exe'
          (Get-FileHash './stage/高校认证.exe' -Algorithm SHA256).Hash.ToLower() | Out-File stage/app.sha256 -Encoding ascii
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path ./stage).Path, (Join-Path (Get-Location) 'chsi-rust-client.zip'))
      - name: Smoke test (selftest mode)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\rust-client\target\release\chsi-rust.exe -ArgumentList '--selftest' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited -and $p.ExitCode -ne 0) { Write-Host "EXITED code=$($p.ExitCode)"; exit 1 }
          Write-Host "SELFTEST OK"
      - uses: actions/upload-artifact@v4
        with:
          name: chsi-rust-client
          path: chsi-rust-client.zip
