name: build-apk
on:
  push:
    paths: ['android-apk/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 组件（runner 预装 SDK，直接 sdkmanager）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch arm64 adb (static, from android-sdk-tools releases)
        run: |
          set -e
          REL=$(curl -s https://api.github.com/repos/lzhiyong/android-sdk-tools/releases/latest | grep browser_download_url | grep -o 'https://[^"]*android-sdk-tools[^"]*\.zip' | head -1)
          echo "release: $REL"
          curl -L -o tools.zip "$REL"
          unzip -o tools.zip -d toolsx > /dev/null
          ADB=$(find toolsx -type f -name adb | head -1)
          file "$ADB" || true
          mkdir -p android-apk/app/src/main/jniLibs/arm64-v8a
          cp "$ADB" android-apk/app/src/main/jniLibs/arm64-v8a/libadb.so
          chmod +x android-apk/app/src/main/jniLibs/arm64-v8a/libadb.so
          ls -la android-apk/app/src/main/jniLibs/arm64-v8a/

      - name: Keystore（首次生成；已提交仓库则复用 → 证书哈希稳定）
        run: |
          if [ ! -f android-apk/app/keystore/release.jks ]; then
            mkdir -p android-apk/app/keystore
            keytool -genkeypair -v -keystore android-apk/app/keystore/release.jks \
              -alias chsi -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass chsi2026 -keypass chsi2026 \
              -dname "CN=ChsiTool, OU=Dev, O=Chsi, C=CN"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-apk
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chsi-apk
          path: android-apk/app/build/outputs/apk/release/*.apk

      - name: Upload keystore（首次生成时取回并提交仓库 → 证书哈希稳定）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chsi-keystore
          path: android-apk/app/keystore/release.jks
