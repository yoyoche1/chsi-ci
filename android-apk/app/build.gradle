plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.chsi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chsi.app"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.12"
        ndk { abiFilters 'arm64-v8a' }
        packagingOptions {
            doNotStrip "**/libadb.so"
            jniLibs.useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            storeFile file('keystore/release.jks')
            storePassword System.getenv('KS_PASS') ?: 'chsi2026'
            keyAlias 'chsi'
            keyPassword System.getenv('KS_PASS') ?: 'chsi2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file('keystore/release.jks').exists()) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
